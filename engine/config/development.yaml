logger:
  enable: true
  pretty_backtrace: true
  level: info
  format: compact

server:
  port: 5150
  binding: 0.0.0.0
  host: http://localhost

database:
  uri: <%= get_env(name="DATABASE_URL", default="") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

workers:
  mode: ForegroundBlocking

mailer:
  stub: true
