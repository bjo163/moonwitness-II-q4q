logger:
  enable: false
  pretty_backtrace: false
  level: error
  format: compact

server:
  port: 5151
  binding: 127.0.0.1
  host: http://localhost

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://q4q_engine_test.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 500
  min_connections: 1
  max_connections: 2
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

workers:
  mode: ForegroundBlocking

mailer:
  stub: true
