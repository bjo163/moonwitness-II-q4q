logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: 0.0.0.0
  host: <%= get_env(name="APP_HOST", default="http://localhost") %>

database:
  uri: <%= get_env(name="DATABASE_URL", default="") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 1000
  min_connections: 1
  max_connections: 10
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

workers:
  mode: ForegroundBlocking

mailer:
  stub: true
